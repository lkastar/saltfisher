<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>导入闲鱼凭证</title>
    <style>
      /* Inline because MV3's page CSP allows inline styles and not inline
         scripts, and one stylesheet file for eleven rules is one file too
         many. */
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font: 13px/1.6 system-ui, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      label {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: #4b5563;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        padding: 5px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin: 10px 0 0;
        padding: 8px;
        border-radius: 6px;
        background: #f3f4f6;
        white-space: pre-wrap;
        font-size: 12px;
        min-height: 1em;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 11.5px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>导入闲鱼凭证</h1>
    <p class="hint">
      在已登录闲鱼的这个浏览器里点「导入」，就会把登录 cookie（含只存在于 taobao 域的
      <code>_m_h5_tk</code>）和一份环境快照发到你自己的面板。凭证不显示、不落盘、不去别处。
    </p>

    <label for="panel-origin">面板地址</label>
    <input id="panel-origin" type="text" placeholder="http://127.0.0.1:8000" spellcheck="false" />

    <label for="api-token">API token（面板的 SFD_API_TOKEN）</label>
    <input id="api-token" type="password" autocomplete="off" spellcheck="false" />

    <div class="row">
      <button id="save" type="button">保存</button>
      <button id="run" type="button">导入</button>
    </div>

    <p id="status"></p>

    <p class="hint">
      导入失败、或者面板开在明文 http 的局域网地址上连不通，就回面板设置页走开发者工具流程。
      那条路永远可用。
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
